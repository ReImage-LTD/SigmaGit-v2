services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sigmagit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: sigmagit
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sigmagit -d sigmagit']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - sigmagit

  redis-session:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_session_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sigmagit

  redis-cache:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_cache_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sigmagit

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql://sigmagit:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/sigmagit
    command: ['bun', 'run', 'dist/migrate.js']
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy
    networks: [sigmagit]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    mem_limit: ${API_MEMORY_LIMIT:-1280m}
    volumes:
      - repositories_data:/data/repos
    env_file:
      - .env
    environment:
      STORAGE_LOCAL_PATH: /data/repos
      NODE_ENV: production
      PORT: '3001'
      API_MEMORY_BUDGET_MB: ${API_MEMORY_BUDGET_MB:-1024}
      TRUST_PROXY: 'true'
      TRUSTED_PROXY_CIDRS: 172.16.0.0/12
      REDIS_SESSION_URL: redis://redis-session:6379
      REDIS_CACHE_URL: redis://redis-cache:6379
      DATABASE_URL: postgresql://sigmagit:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/sigmagit
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis-session:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
    expose:
      - '3001'
    cap_drop: ['ALL']
    security_opt: ['no-new-privileges:true']
    pids_limit: 256
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:$${PORT:-3001}/ready']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - sigmagit

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_URL: ${WEB_URL:-http://localhost}
        VITE_API_URL: ${WEB_URL:-http://localhost}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    expose:
      - '3000'
    cap_drop: ['ALL']
    security_opt: ['no-new-privileges:true']
    pids_limit: 256
    networks:
      - sigmagit

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      API_UPSTREAM: api:3001
      WEB_UPSTREAM: web:3000
      DOCS_UPSTREAM: host.docker.internal:3003
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - web
    networks:
      - sigmagit

networks:
  sigmagit:
    driver: bridge

volumes:
  repositories_data:
  postgres_data:
  redis_session_data:
  redis_cache_data:
  caddy_data:
  caddy_config:
