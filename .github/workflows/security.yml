name: Security and quality

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  runner-integration:
    name: Runner and API integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: runner-test-only
          POSTGRES_DB: runner_e2e
        ports:
          - 55439:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      - name: Runner unit tests
        working-directory: apps/runner
        run: go test ./cmd/agent -race -count=1
      - name: Real API, Git, PostgreSQL and Docker round trip
        run: bun run test:runner-integration
        env:
          RUNNER_TEST_DATABASE_URL: postgres://postgres:runner-test-only@127.0.0.1:55439/runner_e2e

  api-tests:
    name: API security tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Install
        run: bun install --frozen-lockfile
      - name: API unit tests
        run: cd apps/api && bun test src/test
      - name: Web security unit tests
        run: cd apps/web && bun run test

  lint-build:
    name: Lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Install
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Build API
        run: cd apps/api && bun run build
      - name: Build web
        run: cd apps/web && bun run build

  dependency-audit:
    name: bun audit (blocking high/critical runtime)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Install
        run: bun install --frozen-lockfile
      - name: Audit and fail on high/critical production deps
        run: |
          set -euo pipefail
          bun audit 2>&1 | tee /tmp/bun-audit.txt || true
          # Fail if high/critical advisories hit production workspace packages
          # (api, web runtime, db, lib) — not pure dev tooling (eslint, shadcn CLI).
          if rg -i 'high:|critical:' /tmp/bun-audit.txt | rg -i 'workspace:@sigmagit/(api|web|db|lib|hooks)' >/tmp/prod-hits.txt; then
            echo "::error::High/critical advisories in production workspaces:"
            cat /tmp/prod-hits.txt
            exit 1
          fi
          # Also fail if direct runtime deps (hono, drizzle, nodemailer, undici, ws, h3, srvx, nitro) still vulnerable
          if rg -i '(^| )(hono|drizzle-orm|nodemailer|undici|ws|h3|srvx|nitro) ' /tmp/bun-audit.txt | rg -i 'high:|critical:' >/tmp/runtime-hits.txt 2>/dev/null; then
            # Check if any high/critical section mentions these packages
            :
          fi
          # Parse: if any of these packages appear as the subject of a high/critical finding
          python3 - <<'PY'
          import re, sys
          text = open("/tmp/bun-audit.txt").read()
          # Bun audit format: package version\n  workspace:...\n  severity: ...
          blocks = re.split(r"\n(?=\S)", text)
          runtime = {"hono", "drizzle-orm", "nodemailer", "undici", "ws", "h3", "srvx", "nitro", "better-auth"}
          prod_ws = ("@sigmagit/api", "@sigmagit/web", "@sigmagit/db", "@sigmagit/lib", "@sigmagit/hooks")
          bad = []
          for b in blocks:
              low = b.lower()
              if "high:" not in low and "critical:" not in low:
                  continue
              # package name is first token of first line
              first = b.strip().splitlines()[0] if b.strip() else ""
              pkg = first.split()[0] if first else ""
              if pkg in runtime:
                  bad.append(first)
                  continue
              if any(ws in b for ws in prod_ws) and "shadcn" not in low and "eslint" not in low:
                  bad.append(first)
          if bad:
              print("Blocking high/critical runtime findings:")
              for x in bad:
                  print(" -", x)
              sys.exit(1)
          print("No blocking high/critical runtime findings.")
          PY

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: docker://zricethezav/gitleaks:v8.28.0
        with:
          args: detect --source=/github/workspace --no-banner --redact --verbose
